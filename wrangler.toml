name = "portfolio"
compatibility_date = "2026-10-01"
pages_build_output_dir = "./dist"

# Après `npx wrangler d1 create portfolio`, remplacer database_id par l'identifiant renvoyé.
[[d1_databases]]
binding = "DB"
database_name = "portfolio"
database_id = "be8186dd-6b4a-46f4-859c-c14c3c955df2"
migrations_dir = "migrations"

# Créé avec `npx wrangler r2 bucket create portfolio-files`.
[[r2_buckets]]
binding = "FILES"
bucket_name = "portfolio-files"
